<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
<g opacity="0.07">

  <!-- Joy-Con pill -->
  <g transform="translate(18,14)">
    <rect x="0" y="0" width="20" height="46" rx="10"/>
    <circle cx="10" cy="14" r="2.2" fill="#ffffff" stroke="none"/>
    <circle cx="10" cy="32" r="2.2" fill="#ffffff" stroke="none"/>
  </g>

  <!-- A/B/X/Y cluster -->
  <g transform="translate(90,10)" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" stroke="none">
    <circle cx="16" cy="0" r="9" fill="none" stroke="#ffffff"/>
    <text x="16" y="4" text-anchor="middle">X</text>
    <circle cx="0" cy="16" r="9" fill="none" stroke="#ffffff"/>
    <text x="0" y="20" text-anchor="middle">Y</text>
    <circle cx="32" cy="16" r="9" fill="none" stroke="#ffffff"/>
    <text x="32" y="20" text-anchor="middle">A</text>
    <circle cx="16" cy="32" r="9" fill="none" stroke="#ffffff"/>
    <text x="16" y="36" text-anchor="middle">B</text>
  </g>

  <!-- D-pad -->
  <g transform="translate(190,18)">
    <path d="M10 0h8v8h8v8h-8v8h-8v-8H2V8h8z"/>
  </g>

  <!-- Battery -->
  <g transform="translate(250,20)">
    <rect x="0" y="0" width="34" height="16" rx="3"/>
    <rect x="34" y="5" width="4" height="6" rx="1" fill="#ffffff" stroke="none"/>
    <rect x="3" y="3" width="18" height="10" fill="#ffffff" stroke="none" opacity="0.9"/>
  </g>

  <!-- Wifi -->
  <g transform="translate(38,96)">
    <path d="M0 8a22 22 0 0128 0"/>
    <path d="M6 14a13 13 0 0116 0"/>
    <circle cx="14" cy="20" r="2.2" fill="#ffffff" stroke="none"/>
  </g>

  <!-- Cube (3D model) -->
  <g transform="translate(110,90)">
    <path d="M14 0l14 8v16l-14 8-14-8V8z"/>
    <path d="M0 8l14 8 14-8"/>
    <path d="M14 16v16"/>
  </g>

  <!-- Star outline -->
  <g transform="translate(196,92)">
    <path d="M16 0l4.5 9.8L31 11l-7.5 7.3L25.3 30 16 24.4 6.7 30l1.8-11.7L1 11l10.5-1.2z"/>
  </g>

  <!-- Console / handheld -->
  <g transform="translate(252,88)">
    <rect x="0" y="0" width="34" height="24" rx="4"/>
    <circle cx="6" cy="6" r="1.8" fill="#ffffff" stroke="none"/>
    <circle cx="28" cy="18" r="1.8" fill="#ffffff" stroke="none"/>
  </g>

  <!-- Heart outline -->
  <g transform="translate(12,168)">
    <path d="M14 26C4 18 0 12 0 7a7 7 0 0114-3 7 7 0 0114 3c0 5-4 11-14 19z"/>
  </g>

  <!-- Play button -->
  <g transform="translate(80,168)">
    <circle cx="14" cy="14" r="14"/>
    <path d="M11 8l9 6-9 6z" fill="#ffffff" stroke="none"/>
  </g>

  <!-- Gear -->
  <g transform="translate(150,162)">
    <circle cx="13" cy="13" r="5.5"/>
    <path d="M13 0v6M13 20v6M0 13h6M20 13h6M3.8 3.8l4.2 4.2M18 18l4.2 4.2M22.2 3.8L18 8M8 18l-4.2 4.2"/>
  </g>

  <!-- Lightning bolt -->
  <g transform="translate(212,160)">
    <path d="M16 0L2 18h10l-4 16 18-20H16z"/>
  </g>

  <!-- Second joy-con pill (offset) -->
  <g transform="translate(272,156)">
    <rect x="0" y="0" width="18" height="42" rx="9"/>
    <circle cx="9" cy="13" r="2" fill="#ffffff" stroke="none"/>
    <circle cx="9" cy="29" r="2" fill="#ffffff" stroke="none"/>
  </g>

  <!-- Second D-pad (offset) -->
  <g transform="translate(40,236)">
    <path d="M10 0h8v8h8v8h-8v8h-8v-8H2V8h8z"/>
  </g>

  <!-- Second battery -->
  <g transform="translate(96,242)">
    <rect x="0" y="0" width="30" height="14" rx="3"/>
    <rect x="30" y="4" width="4" height="6" rx="1" fill="#ffffff" stroke="none"/>
  </g>

  <!-- Second star -->
  <g transform="translate(160,236)">
    <path d="M14 0l4 8.6 9.6 1-7 6.4 1.8 9.6L14 21l-8.4 4.6L7.4 16 0.4 9.6 10 8.6z"/>
  </g>

  <!-- Second cube -->
  <g transform="translate(226,232)">
    <path d="M13 0l13 7.5v15L13 30 0 22.5v-15z"/>
    <path d="M0 7.5l13 7.5 13-7.5"/>
    <path d="M13 15v15"/>
  </g>

  <!-- Second console -->
  <g transform="translate(272,234)">
    <rect x="0" y="0" width="30" height="20" rx="4"/>
    <circle cx="5" cy="5" r="1.6" fill="#ffffff" stroke="none"/>
    <circle cx="25" cy="15" r="1.6" fill="#ffffff" stroke="none"/>
  </g>

</g>
</svg>
